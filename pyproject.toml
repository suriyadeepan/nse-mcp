[project]
name = "kite-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "duckdb>=1.5.6",
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
    "openai>=1.0",
    "tiktoken>=0.9",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.0",
    "langfuse>=5.2.0",
]

[project.scripts]
kite-mcp = "server.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
